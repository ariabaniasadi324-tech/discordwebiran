<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گفتگو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0F1A2E;--panel:#15223B;--panel2:#1C2C4A;--elev:#22335640;--border:#2A3B5C;
--teal:#2FC9BC;--teal-dim:#2FC9BC26;--gold:#E8A33D;--gold-dim:#E8A33D22;
--text:#F1EEE6;--muted:#8C9BB8;--danger:#E4574C;--online:#3FCB8C;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button,input{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
#login-screen{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse 700px 500px at 50% -10%,#1B2E4E 0%,transparent 60%),var(--bg)}
.auth-card{width:min(420px,100%);padding:30px;background:rgba(21,34,59,.96);border:1px solid var(--border);border-radius:24px;box-shadow:0 30px 90px #0007;backdrop-filter:blur(20px);animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.auth-brand{text-align:center;margin-bottom:22px}.auth-logo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,var(--teal),#1C8B80);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 12px 35px #2FC9BC30}.auth-brand h1{font-size:25px;font-weight:900}.auth-brand p{color:var(--muted);font-size:13px;margin-top:5px}
.auth-tabs{display:flex;gap:5px;background:var(--bg);padding:5px;border-radius:12px;margin-bottom:20px}.auth-tabs button{flex:1;padding:11px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700}.auth-tabs button.active{background:var(--teal);color:#06231F}
.auth-form{display:none;flex-direction:column;gap:8px}.auth-form.active{display:flex}.auth-form label{font-size:12px;color:var(--muted);margin-top:4px}.auth-form input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--border);background:var(--bg);color:#fff;outline:none}.auth-form input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}.auth-submit{width:100%;padding:13px;border:0;border-radius:11px;background:var(--teal);color:#06231F;font-weight:800;margin-top:10px}.auth-submit:disabled{opacity:.6;cursor:wait}.auth-error{min-height:18px;color:var(--danger);font-size:12px;text-align:center}.auth-switch{text-align:center;color:var(--muted);font-size:12px}.auth-switch button{border:0;background:none;color:var(--teal);font-weight:700}
#app{height:100vh;grid-template-columns:240px 1fr 210px;display:none}#app.active{display:grid}
#channels-sidebar,#members-sidebar{background:var(--panel);overflow-y:auto}.sidebar-eyebrow{padding:10px 16px 8px;font-size:11px;font-weight:700;color:var(--muted)}.channel-item{padding:9px 16px;margin:1px 10px;border-radius:8px;color:var(--muted);font-size:14px;cursor:pointer}.channel-item:hover{background:var(--elev);color:var(--text)}.channel-item.active{background:var(--teal-dim);color:var(--text)}.hash{color:var(--teal);font-weight:700}
.voice-room{margin:1px 10px 2px;border-radius:8px;overflow:hidden}.voice-room-header{padding:9px 12px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;align-items:center;border-radius:8px}.voice-room-header:hover{background:var(--elev);color:var(--text)}.voice-room-header.connected{background:var(--gold-dim);color:var(--gold)}.label{display:flex;gap:6px;align-items:center}.voice-count{font-size:10px;background:var(--elev);padding:2px 7px;border-radius:20px}.voice-participants{padding:2px 30px 8px;display:flex;flex-direction:column;gap:5px}.voice-participant{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}.room-admin-badge{font-size:9px;color:var(--gold);margin-right:auto}.ban-user-btn{margin-right:auto;border:0;background:none;color:var(--danger);font-size:10px}
.room-actions{display:flex;gap:4px;align-items:center}.room-icon-btn{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px}.room-icon-btn:hover{color:var(--danger)}
#create-room-btn{margin:4px 10px 8px;width:calc(100% - 20px);padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--elev);color:var(--text);font-weight:700}
#voice-controls{display:none;margin-top:auto;padding:12px 14px;background:var(--panel2);border-top:1px solid var(--border);flex-direction:column;gap:9px}#voice-controls.active{display:flex}.status{font-size:12px;color:var(--online);font-weight:600}.btns{display:flex;gap:6px}.btns button{flex:1;padding:9px;border:0;border-radius:8px;background:var(--elev);color:#fff}.btns #mute-btn.muted{background:var(--danger)}#leave-voice-btn{border:1px solid var(--danger)!important;color:var(--danger)!important;background:transparent!important}
.voice-extra-btns{display:flex;gap:6px;flex-wrap:wrap}.voice-extra-btns button{flex:1;min-width:64px;padding:7px;border:0;border-radius:8px;background:var(--elev);color:#fff;font-size:11px}.voice-extra-btns button.on{background:var(--teal);color:#06231F}
#chat-screen{display:flex;flex-direction:column;height:100vh;min-width:0}#chat-header{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:700}#user-menu{margin-right:auto;display:flex;align-items:center;gap:8px}.user-name{color:var(--muted);font-size:12px}.logout-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 10px}.logout-btn:hover{background:var(--danger);border-color:var(--danger)}
.friends-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12.5px}.friends-btn:hover{background:var(--teal-dim);border-color:var(--teal)}.req-badge{background:var(--danger);color:#fff;font-size:9px;border-radius:20px;padding:1px 6px;margin-right:3px}
#video-grid{display:none;flex-wrap:wrap;gap:8px;padding:10px 22px;background:var(--panel2)}#video-grid.active{display:flex}.video-tile{position:relative;width:130px;height:98px;border-radius:10px;overflow:hidden;background:#000;flex-shrink:0}.video-tile video{width:100%;height:100%;object-fit:cover}.video-tile .vt-name{position:absolute;bottom:3px;right:6px;font-size:10px;background:#0008;padding:1px 6px;border-radius:10px}
#messages{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}#messages:empty::after{content:"هنوز پیامی نیست — اولین نفر باش که چیزی می‌نویسه";color:var(--muted);font-size:13px;text-align:center;margin:auto}.msg-row{display:flex;gap:10px;align-items:flex-start;animation:msg .18s}.avatar{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#06231F}.msg-body{max-width:68%}.msg-bubble{background:var(--panel);padding:10px 14px;border-radius:4px 14px 14px 14px;font-size:14.5px;line-height:1.6;word-break:break-word}.msg-meta{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;padding:0 2px}.author{font-size:12.5px;font-weight:700}.time{font-size:10.5px;color:var(--muted)}@keyframes msg{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#chat-form{display:flex;padding:13px 16px;background:var(--panel);margin:0 16px 16px;border-radius:var(--radius);border:1px solid var(--border);gap:8px}#message-input{flex:1;padding:6px;border:0;background:none;color:#fff;outline:0;font-size:14.5px}#chat-form button{background:var(--teal);color:#06231F;border:0;border-radius:8px;padding:8px 16px;font-weight:700}
#members-sidebar{padding:16px 0;border-right:1px solid var(--border)}#members-list{display:flex;flex-direction:column;gap:2px}.member-item{display:flex;align-items:center;gap:9px;padding:7px 16px;font-size:13.5px}.avatar-sm{width:22px;height:22px;border-radius:7px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#06231F;position:relative;flex-shrink:0}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--online);border:2px solid var(--panel);position:absolute;bottom:-2px;left:-2px}
.room-create-modal,.modal-overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}.room-create-modal.active,.modal-overlay.active{display:flex}.room-create-card{width:min(360px,calc(100vw - 30px));background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 20px 60px #0008}.room-create-card h3{margin-bottom:12px}.room-create-card input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:#fff;outline:0}.room-create-actions{display:flex;gap:8px;margin-top:12px}.room-create-actions button{flex:1;padding:9px;border:0;border-radius:8px;font-weight:700}.confirm{background:var(--teal);color:#06231F}.cancel{background:var(--elev);color:#fff}
.pw-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.modal-card{width:min(440px,100%);max-height:82vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 20px 60px #0008;position:relative}.modal-card h3{margin-bottom:12px}.modal-close{position:absolute;top:12px;left:14px;background:none;border:0;color:var(--muted);font-size:18px}
.friends-tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:14px}.friends-tabs button{flex:1;padding:8px 4px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700}.friends-tabs button.active{background:var(--teal);color:#06231F}
.friends-tab-content{display:none;flex-direction:column;gap:8px}.friends-tab-content.active{display:flex}
.search-row{display:flex;gap:6px;margin-bottom:8px}.search-row input{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:#fff;outline:0}.search-row button{padding:10px 14px;border:0;border-radius:8px;background:var(--teal);color:#06231F;font-weight:700}
.user-row{display:flex;align-items:center;gap:10px;padding:8px;background:var(--elev);border-radius:9px}.user-row .uname{flex:1;font-size:13.5px}.user-row .actions{display:flex;gap:5px}.user-row .actions button{border:0;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:700}
.btn-add{background:var(--teal);color:#06231F}.btn-accept{background:var(--online);color:#06231F}.btn-reject,.btn-block{background:var(--danger);color:#fff}.btn-dm{background:var(--gold);color:#06231F}.btn-unblock{background:var(--elev);color:#fff}
.empty-hint{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 0}
@media(max-width:820px){#app.active{grid-template-columns:76px 1fr}#members-sidebar{display:none}.sidebar-eyebrow{display:none}.channel-item{display:flex;justify-content:center;padding:10px 0}.channel-item span:not(.hash),.voice-room-header .label span:last-child,.voice-count,.voice-participants{display:none}.voice-room-header{justify-content:center;padding:10px 0}.friends-btn span{display:none}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">💬</div>
      <h1>گفتگو</h1>
      <p>چت متنی و صوتی، بدون هیچ نصبی</p>
    </div>
    <div class="auth-tabs">
      <button id="login-tab" class="active">ورود</button>
      <button id="register-tab">ثبت‌نام</button>
    </div>

    <div id="login-form" class="auth-form active">
      <label>ایمیل</label>
      <input id="login-email" type="email" placeholder="example@gmail.com" autocomplete="email">
      <label>رمز عبور</label>
      <input id="login-password" type="password" placeholder="رمز عبور" autocomplete="current-password">
      <button class="auth-submit" id="login-btn">ورود به گفتگو</button>
      <div class="auth-error" id="login-error"></div>
      <div class="auth-switch">حساب نداری؟ <button id="go-register">ثبت‌نام کن</button></div>
    </div>

    <div id="register-form" class="auth-form">
      <label>نام نمایشی</label>
      <input id="register-name" type="text" maxlength="20" placeholder="مثلاً Falafel" autocomplete="nickname">
      <label>ایمیل</label>
      <input id="register-email" type="email" placeholder="example@gmail.com" autocomplete="email">
      <label>رمز عبور</label>
      <input id="register-password" type="password" placeholder="حداقل ۶ کاراکتر" autocomplete="new-password">
      <label>تکرار رمز عبور</label>
      <input id="register-password2" type="password" placeholder="رمز را دوباره وارد کن" autocomplete="new-password">
      <button class="auth-submit" id="register-btn">ساخت حساب</button>
      <div class="auth-error" id="register-error"></div>
      <div class="auth-switch">حساب داری؟ <button id="go-login">وارد شو</button></div>
    </div>
  </div>
</div>

<div id="app">
  <div id="channels-sidebar">
    <div class="sidebar-eyebrow">چنل‌های متنی</div>
    <div class="channel-item active" data-channel="عمومی" onclick="switchChannel('عمومی')"><span class="hash">#</span><span>عمومی</span></div>
    <div class="sidebar-eyebrow" style="margin-top:16px">چنل‌های صوتی</div>
    <button id="create-room-btn" onclick="openCreateRoom()">＋ ساخت اتاق</button>
    <div id="voice-rooms-list"></div>
    <div id="voice-controls">
      <div class="status">● متصل به «<span id="connected-room-name"></span>»</div>
      <div class="btns"><button id="mute-btn" onclick="toggleMute()">🎤 قطع میکروفون</button><button id="leave-voice-btn" onclick="leaveVoice()">خروج</button></div>
      <div class="voice-extra-btns">
        <button id="cam-btn" onclick="toggleCamera()">📷 دوربین</button>
        <button id="screen-btn" onclick="toggleScreenShare()">🖥️ اسکرین</button>
        <button id="invite-btn" onclick="copyInviteLink()">🔗 دعوت</button>
      </div>
    </div>
  </div>

  <div id="chat-screen">
    <div id="chat-header">
      <span class="hash">#</span><span id="current-channel-name">عمومی</span>
      <button id="back-to-channel-btn" class="friends-btn" style="display:none" onclick="exitDM()">← بازگشت</button>
      <div id="user-menu">
        <button class="friends-btn" onclick="openFriends()">👥 دوستان <span class="req-badge" id="req-count-badge" style="display:none"></span></button>
        <span class="user-name" id="user-menu-name"></span>
        <button class="logout-btn" onclick="logout()">خروج</button>
      </div>
    </div>
    <div id="video-grid"></div>
    <div id="messages"></div>
    <form id="chat-form" onsubmit="sendMessage(event)">
      <input id="message-input" placeholder="پیامت رو بنویس..." autocomplete="off">
      <button type="submit">ارسال</button>
    </form>
  </div>

  <div id="members-sidebar">
    <div class="sidebar-eyebrow">آنلاین — <span id="online-count">0</span></div>
    <div id="members-list"></div>
  </div>
</div>

<div id="create-room-modal" class="room-create-modal">
  <div class="room-create-card">
    <h3>ساخت اتاق گفت‌وگو</h3>
    <input id="new-room-name" maxlength="30" placeholder="مثلاً گیم شبانه">
    <div class="pw-row">
      <input type="checkbox" id="new-room-haspw" onchange="document.getElementById('new-room-pw-wrap').style.display=this.checked?'block':'none'">
      <label for="new-room-haspw">این اتاق رمزدار باشد</label>
    </div>
    <div id="new-room-pw-wrap" style="display:none;margin-top:8px">
      <input id="new-room-pw" type="password" placeholder="رمز اتاق">
    </div>
    <div class="room-create-actions">
      <button class="confirm" onclick="createVoiceRoom()">ساخت اتاق</button>
      <button class="cancel" onclick="closeCreateRoom()">انصراف</button>
    </div>
  </div>
</div>

<div id="password-modal" class="modal-overlay">
  <div class="room-create-card">
    <h3>رمز اتاق</h3>
    <input id="room-password-input" type="password" placeholder="رمز اتاق را وارد کن">
    <div class="room-create-actions">
      <button class="confirm" onclick="confirmRoomPassword()">ورود</button>
      <button class="cancel" onclick="cancelRoomPassword()">انصراف</button>
    </div>
  </div>
</div>

<div id="friends-modal" class="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" onclick="closeFriends()">✕</button>
    <h3>دوستان</h3>
    <div class="friends-tabs">
      <button class="ftab active" data-tab="search" onclick="switchFriendsTab('search')">جستجو</button>
      <button class="ftab" data-tab="requests" onclick="switchFriendsTab('requests')">درخواست‌ها</button>
      <button class="ftab" data-tab="list" onclick="switchFriendsTab('list')">دوستان</button>
      <button class="ftab" data-tab="blocked" onclick="switchFriendsTab('blocked')">بلاک‌شده‌ها</button>
    </div>
    <div class="friends-tab-content active" id="ftab-search">
      <div class="search-row"><input id="friend-search-input" placeholder="اسم کاربر..."><button onclick="searchUsers()">جستجو</button></div>
      <div id="search-results"></div>
    </div>
    <div class="friends-tab-content" id="ftab-requests">
      <div id="requests-list"></div>
    </div>
    <div class="friends-tab-content" id="ftab-list">
      <div id="friends-list-content"></div>
    </div>
    <div class="friends-tab-content" id="ftab-blocked">
      <div id="blocked-list-content"></div>
    </div>
  </div>
</div>

<div id="remote-audios" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

};

const MAX_VOICE_PEERS=4;
const DEFAULT_VOICE_ROOMS=[];
let VOICE_ROOMS=[...DEFAULT_VOICE_ROOMS],unsubscribeRooms=null,unsubscribeMessages=null;

function authError(code){
 const m={
 "auth/email-already-in-use":"این ایمیل قبلاً ثبت شده.",
 "auth/invalid-email":"ایمیل معتبر نیست.",
 "auth/weak-password":"رمز عبور باید حداقل ۶ کاراکتر باشد.",
 "auth/invalid-credential":"ایمیل یا رمز عبور اشتباه است.",
 "auth/user-not-found":"این حساب وجود ندارد.",
 "auth/wrong-password":"رمز عبور اشتباه است.",
 "auth/user-disabled":"این حساب غیرفعال شده.",
 "auth/network-request-failed":"اتصال اینترنت مشکل دارد."
 };return m[code]||"عملیات انجام نشد.";
}
function showAuth(mode){
 const l=document.getElementById("login-form"),r=document.getElementById("register-form");
 l.classList.toggle("active",mode==="login");r.classList.toggle("active",mode==="register");
 document.getElementById("login-tab").classList.toggle("active",mode==="login");
 document.getElementById("register-tab").classList.toggle("active",mode==="register");
}
document.getElementById("login-tab").onclick=()=>showAuth("login");
document.getElementById("register-tab").onclick=()=>showAuth("register");
document.getElementById("go-register").onclick=()=>showAuth("register");
document.getElementById("go-login").onclick=()=>showAuth("login");

async function registerAccount(){
 const name=document.getElementById("register-name").value.trim(),email=document.getElementById("register-email").value.trim();
 const p=document.getElementById("register-password").value,p2=document.getElementById("register-password2").value;
 const err=document.getElementById("register-error"),btn=document.getElementById("register-btn");err.textContent="";

async function deleteVoiceRoom(room){

 try{
  const peersSnap=await db.collection("voiceRooms").doc(room).collection("peers").get();
  await Promise.all(peersSnap.docs.map(d=>d.ref.delete()));
  const bansSnap=await db.collection("voiceRooms").doc(room).collection("bans").get();
  await Promise.all(bansSnap.docs.map(d=>d.ref.delete()));
  const sigSnap=await db.collection("voiceRooms").doc(room).collection("signals").get();
  await Promise.all(sigSnap.docs.map(d=>d.ref.delete()));
  await db.collection("voiceRooms").doc(room).delete();

async function joinVoice(room){
 if(!auth.currentUser)return;
 if(await isBannedFromRoom(room))return alert("شما از این اتاق بن شده‌اید.");
 const rd=await db.collection("voiceRooms").doc(room).get();if(!rd.exists)return alert("این اتاق دیگر وجود ندارد.");
 const roomData=rd.data(),owner=roomData.owner;
 if(roomData.hasPassword&&owner!==auth.currentUser.uid){
  const ok=await promptRoomPassword(room,roomData.roomPassword);
  if(!ok)return;
 }
 const peers=db.collection("voiceRooms").doc(room).collection("peers"),snap=await peers.get();
 if(snap.size>=MAX_VOICE_PEERS)return alert("این اتاق پر است (حداکثر "+MAX_VOICE_PEERS+" نفر).");
 if(currentVoiceRoom)await leaveVoice();
 try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false})}catch(e){return alert("دسترسی به میکروفون رد شد یا در دسترس نیست.")}
 currentVoiceRoom=room;isMuted=false;document.getElementById("voice-controls").classList.add("active");document.getElementById("connected-room-name").textContent=room;
 document.querySelectorAll(".voice-room-header").forEach(x=>x.classList.toggle("connected",x.dataset.room===room));
 const existing=[];snap.forEach(d=>existing.push(d.id));
 await peers.doc(username).set({uid:auth.currentUser.uid,joinedAt:firebase.firestore.FieldValue.serverTimestamp(),muted:false,admin:owner===auth.currentUser.uid});
 for(const id of existing)await createPeerConnection(room,id,true);
 unsubParticipants=peers.onSnapshot(s=>s.docChanges().forEach(ch=>{if(ch.type==="removed"&&ch.doc.id!==username)closePeerConnection(ch.doc.id)}));
 unsubSignals=db.collection("voiceRooms").doc(room).collection("signals").where("to","==",username).onSnapshot(s=>s.docChanges().forEach(async ch=>{if(ch.type!=="added")return;await handleSignal(room,ch.doc.data());ch.doc.ref.delete()}));
 unsubRoomDoc=db.collection("voiceRooms").doc(room).onSnapshot(d=>{if(!d.exists&&currentVoiceRoom===room){alert("این اتاق حذف شد.");leaveVoice()}});
}
async function createPeerConnection(room,peerId,initiator){
 if(peerConnections[peerId])return peerConnections[peerId];const pc=new RTCPeerConnection(ICE_SERVERS);peerConnections[peerId]=pc;
 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.ontrack=e=>{
  if(e.track.kind==="audio"){
   let a=document.getElementById("audio-"+peerId);if(!a){a=document.createElement("audio");a.id="audio-"+peerId;a.autoplay=true;document.getElementById("remote-audios").appendChild(a)}a.srcObject=e.streams[0];
  }else if(e.track.kind==="video"){
   const grid=document.getElementById("video-grid");grid.classList.add("active");
   let tile=document.getElementById("vtile-"+peerId);
   if(!tile){tile=document.createElement("div");tile.className="video-tile";tile.id="vtile-"+peerId;tile.innerHTML='<video autoplay playsinline></video><span class="vt-name">'+escapeHtml(peerId)+'</span>';grid.appendChild(tile)}
   tile.querySelector("video").srcObject=e.streams[0];
   e.track.onended=()=>{const t=document.getElementById("vtile-"+peerId);if(t)t.remove();updateVideoGridVisibility()};
  }
 };
 pc.onicecandidate=e=>{if(e.candidate)db.collection("voiceRooms").doc(room).collection("signals").add({from:username,to:peerId,type:"candidate",data:JSON.stringify(e.candidate),timestamp:firebase.firestore.FieldValue.serverTimestamp()})};
 if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await db.collection("voiceRooms").doc(room).collection("signals").add({from:username,to:peerId,type:"offer",data:JSON.stringify(offer),timestamp:firebase.firestore.FieldValue.serverTimestamp()})}
 return pc;
}
async function handleSignal(room,s){
 const id=s.from;let pc=peerConnections[id];
 if(s.type==="offer"){if(!pc)pc=await createPeerConnection(room,id,false);await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(s.data)));const a=await pc.createAnswer();await pc.setLocalDescription(a);await db.collection("voiceRooms").doc(room).collection("signals").add({from:username,to:id,type:"answer",data:JSON.stringify(a),timestamp:firebase.firestore.FieldValue.serverTimestamp()})}
 else if(s.type==="answer"&&pc)await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(s.data)));
 else if(s.type==="candidate"&&pc){try{await pc.addIceCandidate(new RTCIceCandidate(JSON.parse(s.data)))}catch(e){}}
}
function closePeerConnection(id){if(peerConnections[id]){peerConnections[id].close();delete peerConnections[id]}const a=document.getElementById("audio-"+id);if(a)a.remove();const v=document.getElementById("vtile-"+id);if(v)v.remove();updateVideoGridVisibility()}
function toggleMute(){
 if(!localStream)return;isMuted=!isMuted;localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);
 const b=document.getElementById("mute-btn");b.textContent=isMuted?"🔇 روشن کردن میکروفون":"🎤 قطع میکروفون";b.classList.toggle("muted",isMuted);
 if(currentVoiceRoom)db.collection("voiceRooms").doc(currentVoiceRoom).collection("peers").doc(username).update({muted:isMuted}).catch(()=>{});
}

async function renegotiate(pc,peerId){
 try{
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  await db.collection("voiceRooms").doc(currentVoiceRoom).collection("signals").add({from:username,to:peerId,type:"offer",data:JSON.stringify(offer),timestamp:firebase.firestore.FieldValue.serverTimestamp()});
 }catch(e){console.error("renegotiate:",e)}
}
async function addVideoTrackToPeers(track,stream){
 for(const id in peerConnections){const pc=peerConnections[id];pc.addTrack(track,stream);await renegotiate(pc,id)}
}
function showLocalVideoTile(stream){
 const grid=document.getElementById("video-grid");grid.classList.add("active");
 let tile=document.getElementById("vtile-local");
 if(!tile){tile=document.createElement("div");tile.className="video-tile";tile.id="vtile-local";tile.innerHTML='<video autoplay muted playsinline></video><span class="vt-name">تو</span>';grid.appendChild(tile)}
 tile.querySelector("video").srcObject=stream;
}
function hideLocalVideoTile(){const tile=document.getElementById("vtile-local");if(tile)tile.remove();updateVideoGridVisibility()}
function updateVideoGridVisibility(){const grid=document.getElementById("video-grid");if(grid.children.length===0)grid.classList.remove("active")}
async function toggleCamera(){
 if(!currentVoiceRoom)return;
 if(videoMode==="cam"){stopLocalVideo();return}
 if(videoMode==="screen")stopLocalVideo();
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:true});
  camTrack=stream.getVideoTracks()[0];videoMode="cam";
  await addVideoTrackToPeers(camTrack,stream);showLocalVideoTile(stream);
  document.getElementById("cam-btn").classList.add("on");
  camTrack.onended=()=>stopLocalVideo();
 }catch(e){alert("دسترسی به دوربین ممکن نشد.")}
}
async function toggleScreenShare(){
 if(!currentVoiceRoom)return;
 if(videoMode==="screen"){stopLocalVideo();return}
 if(videoMode==="cam")stopLocalVideo();
 try{
  const stream=await navigator.mediaDevices.getDisplayMedia({video:true});
  screenTrack=stream.getVideoTracks()[0];videoMode="screen";
  await addVideoTrackToPeers(screenTrack,stream);showLocalVideoTile(stream);
  document.getElementById("screen-btn").classList.add("on");
  screenTrack.onended=()=>stopLocalVideo();
 }catch(e){}
}
function stopLocalVideo(){
 const track=videoMode==="cam"?camTrack:screenTrack;
 if(track){
  track.stop();
  for(const id in peerConnections){
   const pc=peerConnections[id];const sender=pc.getSenders().find(s=>s.track===track);
   if(sender){pc.removeTrack(sender);renegotiate(pc,id)}
  }
 }
 camTrack=null;screenTrack=null;videoMode=null;
 document.getElementById("cam-btn").classList.remove("on");
 document.getElementById("screen-btn").classList.remove("on");
 hideLocalVideoTile();
}

let leavingVoice=false;
async function leaveVoice(){
 if(!currentVoiceRoom||leavingVoice)return;leavingVoice=true;const room=currentVoiceRoom;currentVoiceRoom=null;
 if(unsubSignals){unsubSignals();unsubSignals=null}if(unsubParticipants){unsubParticipants();unsubParticipants=null}
 if(unsubRoomDoc){unsubRoomDoc();unsubRoomDoc=null}
 if(videoMode)stopLocalVideo();
 Object.keys(peerConnections).forEach(closePeerConnection);
 if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
 document.getElementById("voice-controls").classList.remove("active");document.getElementById("mute-btn").textContent="🎤 قطع میکروفون";document.getElementById("mute-btn").classList.remove("muted");
 document.querySelectorAll(".voice-room-header").forEach(x=>x.classList.remove("connected"));
 document.getElementById("video-grid").innerHTML="";document.getElementById("video-grid").classList.remove("active");
 try{await db.collection("voiceRooms").doc(room).collection("peers").doc(username).delete()}catch(e){}finally{leavingVoice=false}
}

 document.querySelectorAll(".friends-tab-content").forEach(c=>c.classList.remove("active"));
 document.getElementById("ftab-"+tab).classList.add("active");
 if(tab==="list")loadFriendsList();
 if(tab==="blocked")loadBlockedList();
}
async function searchUsers(){
 const q=document.getElementById("friend-search-input").value.trim().toLowerCase();
 const box=document.getElementById("search-results");box.innerHTML="";
 if(!q)return;
 try{
  const snap=await db.collection("users").where("nameLower",">=",q).where("nameLower","<=",q+"\uf8ff").limit(20).get();
  if(snap.empty){box.innerHTML='<div class="empty-hint">کاربری پیدا نشد.</div>';return}
  const myFriendsSnap=await db.collection("friends").doc(auth.currentUser.uid).collection("list").get();
  const friendIds=new Set(myFriendsSnap.docs.map(d=>d.id));
  snap.forEach(doc=>{
   const d=doc.data();if(d.uid===auth.currentUser.uid)return;
   const row=document.createElement("div");row.className="user-row";
   const isFriend=friendIds.has(d.uid);
   row.innerHTML='<span class="avatar-sm" style="background:'+colorForName(d.name)+'">'+escapeHtml(initialsFor(d.name))+'</span><span class="uname">'+escapeHtml(d.name)+'</span><span class="actions">'+(isFriend?'<span style="color:var(--online);font-size:11px">دوست ✓</span>':'<button class="btn-add">افزودن</button>')+'</span>';
   if(!isFriend)row.querySelector(".btn-add").onclick=()=>sendFriendRequest(d.uid,d.name);
   box.appendChild(row);
  });
 }catch(e){console.error(e);box.innerHTML='<div class="empty-hint">خطا در جستجو.</div>'}
}
async function sendFriendRequest(toUid,toName){
 if(!auth.currentUser)return;
 try{
  const blocked=await db.collection("blocks").doc(toUid).collection("list").doc(auth.currentUser.uid).get();
  if(blocked.exists)return alert("امکان ارسال درخواست نیست.");
  await db.collection("friendRequests").doc(toUid).collection("incoming").doc(auth.currentUser.uid).set({fromUid:auth.currentUser.uid,fromName:username,at:firebase.firestore.FieldValue.serverTimestamp()});
  alert("درخواست دوستی ارسال شد.");
 }catch(e){console.error(e);alert("ارسال درخواست انجام نشد.")}
}
function listenForFriendRequests(){
 if(!auth.currentUser)return;
 db.collection("friendRequests").doc(auth.currentUser.uid).collection("incoming").onSnapshot(s=>{
  const badge=document.getElementById("req-count-badge");
  if(s.size>0){badge.textContent=s.size;badge.style.display="inline-block"}else{badge.style.display="none"}
  const list=document.getElementById("requests-list");list.innerHTML="";
  if(s.empty){list.innerHTML='<div class="empty-hint">درخواستی نیست.</div>';return}
  s.forEach(doc=>{
   const d=doc.data();const row=document.createElement("div");row.className="user-row";
   row.innerHTML='<span class="avatar-sm" style="background:'+colorForName(d.fromName)+'">'+escapeHtml(initialsFor(d.fromName))+'</span><span class="uname">'+escapeHtml(d.fromName)+'</span><span class="actions"><button class="btn-accept">قبول</button><button class="btn-reject">رد</button></span>';
   row.querySelector(".btn-accept").onclick=()=>acceptFriendRequest(d.fromUid,d.fromName);
   row.querySelector(".btn-reject").onclick=()=>rejectFriendRequest(d.fromUid);
   list.appendChild(row);
  });
 });
}
async function acceptFriendRequest(fromUid,fromName){
 try{
  await db.collection("friends").doc(auth.currentUser.uid).collection("list").doc(fromUid).set({uid:fromUid,name:fromName,since:firebase.firestore.FieldValue.serverTimestamp()});
  await db.collection("friends").doc(fromUid).collection("list").doc(auth.currentUser.uid).set({uid:auth.currentUser.uid,name:username,since:firebase.firestore.FieldValue.serverTimestamp()});
  await db.collection("friendRequests").doc(auth.currentUser.uid).collection("incoming").doc(fromUid).delete();
 }catch(e){console.error(e);alert("قبول کردن درخواست انجام نشد.")}
}
async function rejectFriendRequest(fromUid){
 try{await db.collection("friendRequests").doc(auth.currentUser.uid).collection("incoming").doc(fromUid).delete()}catch(e){console.error(e)}
}
async function loadFriendsList(){
 const box=document.getElementById("friends-list-content");box.innerHTML='<div class="empty-hint">در حال بارگذاری...</div>';
 try{
  const snap=await db.collection("friends").doc(auth.currentUser.uid).collection("list").get();
  if(snap.empty){box.innerHTML='<div class="empty-hint">هنوز دوستی اضافه نکردی.</div>';return}
  box.innerHTML="";
  snap.forEach(doc=>{
   const d=doc.data();const row=document.createElement("div");row.className="user-row";
   row.innerHTML='<span class="avatar-sm" style="background:'+colorForName(d.name)+'">'+escapeHtml(initialsFor(d.name))+'</span><span class="uname">'+escapeHtml(d.name)+'</span><span class="actions"><button class="btn-dm">پیام</button><button class="btn-block">بلاک</button></span>';
   row.querySelector(".btn-dm").onclick=()=>openDM(d.uid,d.name);
   row.querySelector(".btn-block").onclick=()=>blockUser(d.uid,d.name);
   box.appendChild(row);
  });
 }catch(e){console.error(e);box.innerHTML='<div class="empty-hint">خطا در بارگذاری.</div>'}
}
async function blockUser(uid,name){
 if(!confirm('«'+name+'» بلاک شود؟'))return;
 try{
  await db.collection("blocks").doc(auth.currentUser.uid).collection("list").doc(uid).set({uid,name,at:firebase.firestore.FieldValue.serverTimestamp()});
  await db.collection("friends").doc(auth.currentUser.uid).collection("list").doc(uid).delete();
  await db.collection("friends").doc(uid).collection("list").doc(auth.currentUser.uid).delete();
  loadFriendsList();
 }catch(e){console.error(e);alert("بلاک کردن انجام نشد.")}
}
async function loadBlockedList(){
 const box=document.getElementById("blocked-list-content");box.innerHTML='<div class="empty-hint">در حال بارگذاری...</div>';
 try{
  const snap=await db.collection("blocks").doc(auth.currentUser.uid).collection("list").get();
  if(snap.empty){box.innerHTML='<div class="empty-hint">کسی بلاک نشده.</div>';return}
  box.innerHTML="";
  snap.forEach(doc=>{
   const d=doc.data();const row=document.createElement("div");row.className="user-row";
   row.innerHTML='<span class="avatar-sm" style="background:'+colorForName(d.name)+'">'+escapeHtml(initialsFor(d.name))+'</span><span class="uname">'+escapeHtml(d.name)+'</span><span class="actions"><button class="btn-unblock">رفع بلاک</button></span>';
   row.querySelector(".btn-unblock").onclick=()=>unblockUser(d.uid);
   box.appendChild(row);
  });
 }catch(e){console.error(e);box.innerHTML='<div class="empty-hint">خطا در بارگذاری.</div>'}
}
async function unblockUser(uid){
 try{await db.collection("blocks").doc(auth.currentUser.uid).collection("list").doc(uid).delete();loadBlockedList()}catch(e){console.error(e)}
}

document.getElementById("new-room-name").addEventListener("keydown",e=>{if(e.key==="Enter")createVoiceRoom();if(e.key==="Escape")closeCreateRoom()});
document.getElementById("friend-search-input").addEventListener("keydown",e=>{if(e.key==="Enter")searchUsers()});
window.addEventListener("beforeunload",()=>{if(username)db.collection("presence").doc(username).delete().catch(()=>{});if(localStream)localStream.getTracks().forEach(t=>t.stop())});
</script>
